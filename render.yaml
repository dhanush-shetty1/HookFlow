services:
  - type: web
    name: hookflow
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm install --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
